<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MathConnect - Junior High Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        fun: ['Fredoka', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            touch-action: manipulation;
        }
        h1, h2, h3, .font-fun {
            font-family: 'Fredoka', sans-serif;
        }
        .btn-press:active {
            transform: scale(0.97);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 bg-slate-50 overflow-hidden">

    <div id="app" class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- Top Navigation Bar -->
        <header class="bg-indigo-600 text-white shadow-sm z-20 flex justify-between items-center px-3 py-1.5 sm:px-5 flex-shrink-0">
            <div class="flex items-center gap-1.5">
                <button id="back-to-dashboard-btn" onclick="deselectGrade()" class="hidden text-xs bg-white/20 hover:bg-white/30 text-white px-2 py-1 rounded-lg font-semibold transition-all flex items-center gap-1">
                    ← Grades
                </button>
                <div class="bg-white/10 p-1 rounded-lg text-base">📐</div>
                <div>
                    <h1 class="text-sm sm:text-xl font-bold tracking-tight">MathConnect</h1>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5">
                <!-- Connection Status Indicator -->
                <div id="sync-status-indicator" class="text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-medium flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span> <span id="sync-status-text">Online Sync</span>
                </div>

                <!-- Backup / Restore Sync Button -->
                <button onclick="syncLocalToSupabaseBackup()" id="sync-backup-btn" class="hidden text-[10px] bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded-lg font-bold shadow transition-all animate-pulse flex items-center gap-1">
                    ⚠️ Sync Backup
                </button>
                
                <!-- Mode Switcher -->
                <div class="bg-indigo-900/40 p-0.5 rounded-lg flex items-center border border-indigo-400/30">
                    <button onclick="requestTeacherMode()" id="btn-mode-teacher" class="px-2 py-0.5 rounded-md text-[11px] font-semibold transition-all text-indigo-100 hover:text-white">
                        👨‍🏫 Teacher
                    </button>
                    <button onclick="switchMode('student')" id="btn-mode-student" class="px-2 py-0.5 rounded-md text-[11px] font-semibold transition-all bg-white text-indigo-700 shadow-sm">
                        🎓 Student
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-hidden flex flex-col relative bg-slate-50">
            
            <!-- VIEW 1: Grade Level Dashboard -->
            <div id="view-dashboard" class="flex-1 overflow-y-auto p-3 sm:p-8 flex flex-col">
                <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h2 class="text-xl sm:text-3xl font-bold text-slate-800">Select Grade Level</h2>
                            <p class="text-[11px] sm:text-sm text-slate-500">Tap a grade to open notes and contents.</p>
                        </div>
                        <button onclick="openAddGradeModal()" id="teacher-add-grade-dashboard-btn" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-xl font-semibold transition-all shadow-sm flex items-center gap-1 hidden">
                            ➕ Add Grade
                        </button>
                    </div>

                    <!-- Grade Cards Grid -->
                    <div id="dashboard-grade-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-6">
                        <div class="col-span-full p-6 text-center text-slate-400 text-xs bg-white rounded-xl border border-slate-200">
                            Loading grades...
                        </div>
                    </div>
                </div>
            </div>

            <!-- VIEW 2: Active Grade Content Feed -->
            <div id="view-grade-content" class="flex-1 flex flex-col overflow-hidden hidden">
                
                <!-- Active Grade Header -->
                <div class="bg-white border-b border-slate-200 px-3 py-2 flex justify-between items-center gap-2 shadow-sm flex-shrink-0">
                    <h2 id="current-grade-title" class="text-sm sm:text-xl font-bold text-slate-800 truncate">Grade Title</h2>
                    
                    <!-- Teacher Quick Actions -->
                    <div id="teacher-actions" class="flex items-center gap-1 hidden flex-wrap">
                        <button onclick="openEditGradeProfileModal()" class="btn-press bg-indigo-500 text-white px-2 py-1 rounded text-[10px] font-semibold">👤 Teacher</button>
                        <button onclick="openAddContentModal('note')" class="btn-press bg-amber-400 text-slate-900 px-2 py-1 rounded text-[10px] font-semibold">📝 Note</button>
                        <button onclick="openAddContentModal('reminder')" class="btn-press bg-emerald-500 text-white px-2 py-1 rounded text-[10px] font-semibold">⏰ Reminder</button>
                        <button onclick="openAddContentModal('link')" class="btn-press bg-sky-500 text-white px-2 py-1 rounded text-[10px] font-semibold">🔗 Link</button>
                        <button onclick="deleteActiveGrade()" class="btn-press bg-red-100 text-red-600 px-1.5 py-1 rounded text-[10px]">🗑️</button>
                    </div>
                </div>

                <!-- Teacher Profile Banner -->
                <div id="teacher-profile-banner" class="hidden bg-indigo-900 text-white px-3 py-1.5 flex items-center gap-2 flex-shrink-0">
                    <img id="banner-teacher-photo" src="https://placehold.co/80" alt="Teacher" class="w-7 h-7 rounded-full object-cover border border-indigo-300">
                    <div class="truncate">
                        <h3 id="banner-teacher-name" class="font-bold text-xs">Teacher Name</h3>
                        <p id="banner-teacher-desc" class="text-[10px] text-indigo-200 truncate">Teacher description...</p>
                    </div>
                </div>

                <!-- Content Feed Grid -->
                <div class="flex-1 overflow-y-auto p-2 sm:p-6" id="content-container">
                    <!-- Dynamic Content Cards Inserted Here -->
                </div>

            </div>

        </main>
    </div>

    <!-- Modals -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        
        <!-- Teacher Password Modal -->
        <div id="modal-teacher-auth" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden hidden">
            <div class="bg-indigo-600 text-white p-4 flex justify-between items-center">
                <h3 class="text-base font-bold">Teacher Authentication</h3>
                <button onclick="closeModals()" class="text-indigo-200 hover:text-white font-bold">✕</button>
            </div>
            <div class="p-4 space-y-3">
                <p class="text-xs text-slate-500">Enter password to manage content.</p>
                <input type="password" id="input-teacher-password" placeholder="Password..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500" onkeydown="if(event.key==='Enter') verifyTeacherPassword()">
                <div class="flex justify-end gap-2 pt-2">
                    <button onclick="closeModals()" class="px-4 py-2 rounded-xl text-slate-600 text-xs font-medium">Cancel</button>
                    <button onclick="verifyTeacherPassword()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold shadow">Enter</button>
                </div>
            </div>
        </div>

        <!-- Add Grade Modal -->
        <div id="modal-add-grade" class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden hidden max-h-[90vh] flex flex-col">
            <div class="bg-indigo-600 text-white p-4 flex justify-between items-center flex-shrink-0">
                <h3 class="text-base font-bold">Add Grade Level</h3>
                <button onclick="closeModals()" class="text-indigo-200 hover:text-white font-bold">✕</button>
            </div>
            <div class="p-4 space-y-3 overflow-y-auto flex-1 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Grade Name</label>
                    <input type="text" id="input-grade-name" placeholder="e.g., Grade 7 Math" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Description</label>
                    <input type="text" id="input-grade-desc" placeholder="e.g., Algebra & Geometry" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
                </div>
                <hr class="border-slate-100">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Teacher Name</label>
                    <input type="text" id="input-grade-teacher-name" placeholder="e.g., Mr. Smith" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Teacher Bio</label>
                    <input type="text" id="input-grade-teacher-desc" placeholder="e.g., Math Lead Teacher" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Teacher Photo</label>
                    <input type="file" id="input-grade-teacher-photo-file" accept="image/*" onchange="compressImage(event, 'input-grade-teacher-photo-base64', 300)" class="w-full text-xs text-slate-500">
                    <input type="hidden" id="input-grade-teacher-photo-base64">
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button onclick="closeModals()" class="px-4 py-2 rounded-xl text-slate-600 text-xs font-medium">Cancel</button>
                    <button onclick="saveNewGrade()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold shadow">Create</button>
                </div>
            </div>
        </div>

        <!-- Edit Teacher Profile Modal -->
        <div id="modal-edit-grade-profile" class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden hidden">
            <div class="bg-indigo-600 text-white p-4 flex justify-between items-center">
                <h3 class="text-base font-bold">Edit Teacher Profile</h3>
                <button onclick="closeModals()" class="text-indigo-200 hover:text-white font-bold">✕</button>
            </div>
            <div class="p-4 space-y-3 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Teacher Name</label>
                    <input type="text" id="edit-teacher-name" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Teacher Bio</label>
                    <input type="text" id="edit-teacher-desc" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Teacher Photo</label>
                    <input type="file" id="edit-teacher-photo-file" accept="image/*" onchange="compressImage(event, 'edit-teacher-photo-base64', 300)" class="w-full text-xs text-slate-500">
                    <input type="hidden" id="edit-teacher-photo-base64">
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button onclick="closeModals()" class="px-4 py-2 rounded-xl text-slate-600 text-xs font-medium">Cancel</button>
                    <button onclick="saveTeacherProfile()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold shadow">Save</button>
                </div>
            </div>
        </div>

        <!-- Add/Edit Content Modal -->
        <div id="modal-add-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden hidden max-h-[90vh] flex flex-col">
            <div id="content-modal-header" class="bg-indigo-600 text-white p-4 flex justify-between items-center flex-shrink-0">
                <h3 id="content-modal-title" class="text-base font-bold">Add Content</h3>
                <button onclick="closeModals()" class="text-indigo-200 hover:text-white font-bold">✕</button>
            </div>
            <div class="p-4 space-y-3 overflow-y-auto flex-1 text-sm">
                <input type="hidden" id="input-edit-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Title</label>
                    <input type="text" id="input-content-title" placeholder="Title..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
                </div>
                
                <!-- Universal Thumbnail Photo Option (KB optimized) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">🖼️ Thumbnail Photo (Optional)</label>
                    <input type="file" id="input-thumb-file" accept="image/*" onchange="compressImage(event, 'input-thumb-base64', 300)" class="w-full text-xs text-slate-500">
                    <input type="hidden" id="input-thumb-base64">
                </div>
                
                <div id="field-container-note" class="content-field-group space-y-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Notes, Steps & Google Doc/Sheet Links</label>
                        <textarea id="input-content-body" rows="4" placeholder="Write comprehensive notes, examples, or paste your Google Docs / Sheets links here..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm"></textarea>
                    </div>
                </div>

                <div id="field-container-reminder" class="content-field-group hidden space-y-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Due Date</label>
                        <input type="datetime-local" id="input-reminder-date" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Details</label>
                        <textarea id="input-reminder-body" rows="2" placeholder="Details..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm"></textarea>
                    </div>
                </div>

                <div id="field-container-link" class="content-field-group hidden space-y-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Google Doc / Sheet / External URL</label>
                        <input type="url" id="input-content-url" placeholder="https://docs.google.com/..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Description</label>
                        <textarea id="input-link-desc" rows="2" placeholder="Instructions or description for students..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm"></textarea>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button onclick="closeModals()" class="px-4 py-2 rounded-xl text-slate-600 text-xs font-medium">Cancel</button>
                    <button onclick="saveNewContent()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold shadow">Save</button>
                </div>
            </div>
        </div>

        <!-- Read Content Full Viewer Modal (Scrollable for students) -->
        <div id="modal-view-detail" class="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden hidden max-h-[90vh] flex flex-col">
            <div id="detail-modal-header-bar" class="bg-indigo-600 text-white p-4 flex justify-between items-center flex-shrink-0">
                <h3 id="detail-modal-title" class="text-base font-bold truncate">Note Details</h3>
                <button onclick="closeModals()" class="text-indigo-200 hover:text-white font-bold text-lg">✕</button>
            </div>
            <div id="detail-modal-body" class="p-4 space-y-3 overflow-y-auto flex-1 text-sm bg-white">
                <!-- Injected full content -->
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://lpheculpaxwakrqshgmf.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_xo9Ju3gxXbhpImWPTfaicA_-ay4Fua-';

        let supabaseClient = null;
        let isSupabaseConnected = false;

        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                isSupabaseConnected = true;
            }
        } catch (err) {}

        let currentMode = 'student';
        let grades = [];
        let activeGradeId = null;
        let contents = [];
        let currentContentType = 'note';

        window.onload = async function() {
            await loadGrades();
            setupRealtimeSubscriptions();
            checkForUnsyncedLocalData();
            switchMode('student');
        };

        function setupRealtimeSubscriptions() {
            if (!isSupabaseConnected || !supabaseClient) return;

            try {
                supabaseClient
                    .channel('public-db-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'grades' }, payload => {
                        loadGrades();
                    })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'contents' }, payload => {
                        if (activeGradeId) {
                            loadContentsForGrade(activeGradeId);
                        }
                    })
                    .subscribe();
            } catch (e) {
                console.log("Realtime not configured:", e);
            }
        }

        function requestTeacherMode() {
            if (currentMode === 'teacher') return;
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-teacher-auth').classList.remove('hidden');
            document.getElementById('input-teacher-password').value = '';
            setTimeout(() => document.getElementById('input-teacher-password').focus(), 100);
        }

        function verifyTeacherPassword() {
            const pwd = document.getElementById('input-teacher-password').value;
            if (pwd === '121488') {
                closeModals();
                switchMode('teacher');
            } else {
                alert("Incorrect password.");
                document.getElementById('input-teacher-password').value = '';
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            const btnTeacher = document.getElementById('btn-mode-teacher');
            const btnStudent = document.getElementById('btn-mode-student');
            const teacherAddDashBtn = document.getElementById('teacher-add-grade-dashboard-btn');
            const teacherActions = document.getElementById('teacher-actions');

            if (mode === 'teacher') {
                btnTeacher.className = "px-2 py-0.5 rounded-md text-[11px] font-semibold transition-all bg-white text-indigo-700 shadow-sm";
                btnStudent.className = "px-2 py-0.5 rounded-md text-[11px] font-semibold transition-all text-indigo-100 hover:text-white";
                teacherAddDashBtn.classList.remove('hidden');
                if(activeGradeId) teacherActions.classList.remove('hidden');
            } else {
                btnStudent.className = "px-2 py-0.5 rounded-md text-[11px] font-semibold transition-all bg-white text-indigo-700 shadow-sm";
                btnTeacher.className = "px-2 py-0.5 rounded-md text-[11px] font-semibold transition-all text-indigo-100 hover:text-white";
                teacherAddDashBtn.classList.add('hidden');
                teacherActions.classList.add('hidden');
            }
            renderDashboardGrades();
            if (activeGradeId) renderContents();
        }

        async function loadGrades() {
            let remoteGrades = [];
            if (isSupabaseConnected && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('grades').select('*');
                    if (!error && data) remoteGrades = data;
                } catch (e) {}
            }
            const savedGrades = localStorage.getItem('math_grades_v4');
            const localGrades = savedGrades ? JSON.parse(savedGrades) : [];
            
            const mergedMap = new Map();
            localGrades.forEach(g => mergedMap.set(g.id, g));
            remoteGrades.forEach(g => mergedMap.set(g.id, g));
            grades = Array.from(mergedMap.values());
            
            safeLocalStorageSet('math_grades_v4', JSON.stringify(grades));
            renderDashboardGrades();
        }

        async function loadContentsForGrade(gradeId) {
            let remoteContents = [];
            if (isSupabaseConnected && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('contents').select('*').eq('grade_id', gradeId);
                    if (!error && data) remoteContents = data;
                } catch (e) {}
            }
            const savedContents = localStorage.getItem('math_contents_v4_' + gradeId);
            const localContents = savedContents ? JSON.parse(savedContents) : [];

            const mergedMap = new Map();
            localContents.forEach(c => mergedMap.set(c.id, c));
            remoteContents.forEach(c => mergedMap.set(c.id, c));
            contents = Array.from(mergedMap.values());

            safeLocalStorageSet('math_contents_v4_' + gradeId, JSON.stringify(contents));
            renderContents();
        }

        // Safe LocalStorage wrapper to catch QuotaExceeded errors
        function safeLocalStorageSet(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                console.error("LocalStorage full or disabled:", e);
                alert("⚠️ Storage Warning: Your browser local storage is full. Please use Supabase online backup.");
            }
        }

        function checkForUnsyncedLocalData() {
            if (!isSupabaseConnected || !supabaseClient) return;
            const savedGrades = localStorage.getItem('math_grades_v4');
            if (savedGrades && JSON.parse(savedGrades).length > 0) {
                document.getElementById('sync-backup-btn').classList.remove('hidden');
            }
        }

        async function syncLocalToSupabaseBackup() {
            if (!isSupabaseConnected || !supabaseClient) return;
            const btn = document.getElementById('sync-backup-btn');
            btn.textContent = "⏳ Uploading...";
            try {
                const savedGrades = localStorage.getItem('math_grades_v4');
                if (savedGrades) {
                    for (const g of JSON.parse(savedGrades)) {
                        await supabaseClient.from('grades').upsert(g, { onConflict: 'id' });
                    }
                }
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('math_contents_v4_')) {
                        for (const c of JSON.parse(localStorage.getItem(key) || '[]')) {
                            await supabaseClient.from('contents').upsert(c, { onConflict: 'id' });
                        }
                    }
                }
                btn.textContent = "✅ Synced Online!";
                setTimeout(() => btn.classList.add('hidden'), 3000);
            } catch (err) {
                btn.textContent = "⚠️ Sync Error";
                alert("Sync failed: " + err.message);
            }
        }

        function renderDashboardGrades() {
            const gridEl = document.getElementById('dashboard-grade-grid');
            if (!grades || grades.length === 0) {
                gridEl.innerHTML = `
                    <div class="col-span-full p-6 text-center bg-white rounded-xl border border-slate-200">
                        <p class="text-slate-500 text-xs">No grades available. ${currentMode === 'teacher' ? 'Click "Add Grade" above.' : ''}</p>
                    </div>
                `;
                return;
            }

            gridEl.innerHTML = grades.map(g => `
                <div onclick="selectGrade('${g.id}')" class="btn-press bg-white p-3.5 rounded-xl cursor-pointer transition-all border border-slate-200 shadow-sm hover:border-indigo-400 flex justify-between items-center group">
                    <div class="flex items-center gap-3">
                        ${g.teacherPhoto ? `<img src="${g.teacherPhoto}" class="w-9 h-9 rounded-full object-cover border border-slate-200">` : ''}
                        <div>
                            <h3 class="font-bold text-slate-800 text-sm group-hover:text-indigo-600">${escapeHtml(g.name)}</h3>
                            <p class="text-[11px] text-slate-500">${escapeHtml(g.description || 'Tap to view contents')}</p>
                        </div>
                    </div>
                    <div class="bg-indigo-50 group-hover:bg-indigo-600 group-hover:text-white text-indigo-600 w-7 h-7 rounded-full flex items-center justify-center font-bold text-sm">›</div>
                </div>
            `).join('');
        }

        function selectGrade(id) {
            activeGradeId = id;
            const grade = grades.find(g => g.id === id);
            if (grade) {
                document.getElementById('current-grade-title').textContent = grade.name;
                if (grade.teacherName || grade.teacherBio || grade.teacherPhoto) {
                    document.getElementById('banner-teacher-name').textContent = grade.teacherName || 'Instructor';
                    document.getElementById('banner-teacher-desc').textContent = grade.teacherBio || grade.description;
                    if (grade.teacherPhoto) document.getElementById('banner-teacher-photo').src = grade.teacherPhoto;
                    document.getElementById('teacher-profile-banner').classList.remove('hidden');
                } else {
                    document.getElementById('teacher-profile-banner').classList.add('hidden');
                }
            }

            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-grade-content').classList.remove('hidden');
            document.getElementById('back-to-dashboard-btn').classList.remove('hidden');

            if (currentMode === 'teacher') {
                document.getElementById('teacher-actions').classList.remove('hidden');
            }
            loadContentsForGrade(id);
        }

        function deselectGrade() {
            activeGradeId = null;
            document.getElementById('view-grade-content').classList.add('hidden');
            document.getElementById('back-to-dashboard-btn').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            renderDashboardGrades();
        }

        function renderContents() {
            const container = document.getElementById('content-container');
            if (!activeGradeId) return;

            if (!contents || contents.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-center">
                        <p class="text-slate-400 text-xs">No content published here yet.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-w-4xl mx-auto pb-6">
                    ${contents.map(item => {
                        let icon = '📝';
                        let badgeStyle = 'bg-amber-100 text-amber-800 border-amber-200';
                        let borderHover = 'hover:border-amber-400';
                        
                        if (item.type === 'reminder') {
                            icon = '⏰';
                            badgeStyle = 'bg-emerald-100 text-emerald-800 border-emerald-200';
                            borderHover = 'hover:border-emerald-400';
                        } else if (item.type === 'link') {
                            icon = '🔗';
                            badgeStyle = 'bg-sky-100 text-sky-800 border-sky-200';
                            borderHover = 'hover:border-sky-400';
                        }

                        let oneLineSnippet = '';
                        if (item.type === 'note') oneLineSnippet = item.body || 'Tap to read full notes...';
                        if (item.type === 'reminder') oneLineSnippet = 'Due: ' + (item.dueDate ? new Date(item.dueDate).toLocaleString() : 'N/A');
                        if (item.type === 'link') oneLineSnippet = item.description || item.url;

                        return `
                            <div onclick="openDetailView('${item.id}')" class="btn-press bg-white rounded-xl overflow-hidden border border-slate-200 shadow-sm p-3 flex items-center justify-between gap-3 cursor-pointer ${borderHover} transition-colors">
                                <div class="flex items-center gap-2.5 min-w-0 flex-1">
                                    ${item.thumbnail ? `<img src="${item.thumbnail}" class="w-9 h-9 rounded-lg object-cover flex-shrink-0 border border-slate-200">` : ''}
                                    <div class="min-w-0 flex-1">
                                        <div class="flex items-center gap-1.5 mb-0.5">
                                            <span class="text-[9px] font-semibold px-2 py-0.5 rounded-md border ${badgeStyle}">${icon}${item.type.toUpperCase()}</span>
                                        </div>
                                        <h3 class="font-bold text-slate-800 text-xs truncate">${escapeHtml(item.title)}</h3>
                                        <p class="text-slate-400 text-[11px] truncate">${escapeHtml(oneLineSnippet)}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1 flex-shrink-0" onclick="event.stopPropagation()">
                                    ${currentMode === 'teacher' ? `
                                        <button onclick="editContent('${item.id}')" class="text-slate-400 hover:text-indigo-600 text-[11px] p-1">✏️</button>
                                        <button onclick="deleteContent('${item.id}')" class="text-slate-300 hover:text-red-500 text-[11px] p-1">🗑️</button>
                                    ` : ''}
                                    <span class="text-slate-300 text-xs">›</span>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function openDetailView(id) {
            const item = contents.find(c => c.id === id);
            if (!item) return;

            document.getElementById('detail-modal-title').textContent = item.title;
            
            const headerBar = document.getElementById('detail-modal-header-bar');
            if (item.type === 'reminder') {
                headerBar.className = "bg-emerald-600 text-white p-4 flex justify-between items-center flex-shrink-0";
            } else if (item.type === 'link') {
                headerBar.className = "bg-sky-600 text-white p-4 flex justify-between items-center flex-shrink-0";
            } else {
                headerBar.className = "bg-amber-500 text-slate-900 p-4 flex justify-between items-center flex-shrink-0";
            }

            const bodyEl = document.getElementById('detail-modal-body');

            let contentHtml = '';
            if (item.type === 'note') {
                contentHtml = `
                    <div class="space-y-3">
                        ${item.thumbnail ? `<img src="${item.thumbnail}" class="w-full h-48 object-cover rounded-xl border border-slate-100">` : ''}
                        ${item.body ? `<div class="bg-amber-50/50 p-3 rounded-xl border border-amber-100 text-slate-700 whitespace-pre-line text-sm leading-relaxed">${escapeHtml(item.body)}</div>` : ''}
                    </div>
                `;
            } else if (item.type === 'reminder') {
                contentHtml = `
                    <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-xl space-y-2">
                        ${item.thumbnail ? `<img src="${item.thumbnail}" class="w-full h-40 object-cover rounded-xl border border-slate-100 mb-2">` : ''}
                        <p class="text-xs font-bold text-emerald-800">📅 Due Date: ${item.dueDate ? new Date(item.dueDate).toLocaleString() : 'N/A'}</p>
                        <p class="text-slate-700 text-sm whitespace-pre-line">${escapeHtml(item.body || '')}</p>
                    </div>
                `;
            } else if (item.type === 'link') {
                contentHtml = `
                    <div class="space-y-3">
                        ${item.thumbnail ? `<img src="${item.thumbnail}" class="w-full h-40 object-cover rounded-xl border border-slate-100">` : ''}
                        <p class="text-slate-600 text-sm">${escapeHtml(item.description || '')}</p>
                        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="bg-sky-600 text-white px-4 py-2.5 rounded-xl font-medium text-xs inline-flex items-center gap-1.5 shadow-sm">🌐 Open Google Doc / Sheet ↗</a>
                    </div>
                `;
            }

            bodyEl.innerHTML = contentHtml;
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-view-detail').classList.remove('hidden');
        }

        function openAddGradeModal() {
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-add-grade').classList.remove('hidden');
            document.getElementById('input-grade-name').value = '';
            document.getElementById('input-grade-desc').value = '';
            document.getElementById('input-grade-teacher-name').value = '';
            document.getElementById('input-grade-teacher-desc').value = '';
            document.getElementById('input-grade-teacher-photo-base64').value = '';
        }

        function openEditGradeProfileModal() {
            const grade = grades.find(g => g.id === activeGradeId);
            if (!grade) return;
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-edit-grade-profile').classList.remove('hidden');
            document.getElementById('edit-teacher-name').value = grade.teacherName || '';
            document.getElementById('edit-teacher-desc').value = grade.teacherBio || '';
            document.getElementById('edit-teacher-photo-base64').value = grade.teacherPhoto || '';
        }

        async function saveTeacherProfile() {
            const grade = grades.find(g => g.id === activeGradeId);
            if (!grade) return;
            grade.teacherName = document.getElementById('edit-teacher-name').value.trim();
            grade.teacherBio = document.getElementById('edit-teacher-desc').value.trim();
            const photoB64 = document.getElementById('edit-teacher-photo-base64').value;
            if (photoB64) grade.teacherPhoto = photoB64;

            safeLocalStorageSet('math_grades_v4', JSON.stringify(grades));
            if (isSupabaseConnected && supabaseClient) {
                await supabaseClient.from('grades').upsert(grade, { onConflict: 'id' });
            }
            closeModals();
            selectGrade(activeGradeId);
        }

        function openAddContentModal(type) {
            if (!activeGradeId) return;
            currentContentType = type;
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-add-content').classList.remove('hidden');
            document.getElementById('input-edit-id').value = '';
            
            document.getElementById('field-container-note').classList.add('hidden');
            document.getElementById('field-container-reminder').classList.add('hidden');
            document.getElementById('field-container-link').classList.add('hidden');

            const modalHeader = document.getElementById('content-modal-header');
            const titleEl = document.getElementById('content-modal-title');
            
            if (type === 'note') { 
                titleEl.textContent = "Add Note"; 
                modalHeader.className = "bg-amber-400 text-slate-900 p-4 flex justify-between items-center flex-shrink-0";
                document.getElementById('field-container-note').classList.remove('hidden'); 
            }
            else if (type === 'reminder') { 
                titleEl.textContent = "Add Reminder"; 
                modalHeader.className = "bg-emerald-600 text-white p-4 flex justify-between items-center flex-shrink-0";
                document.getElementById('field-container-reminder').classList.remove('hidden'); 
            }
            else if (type === 'link') { 
                titleEl.textContent = "Add Google Doc / Sheet Link"; 
                modalHeader.className = "bg-sky-600 text-white p-4 flex justify-between items-center flex-shrink-0";
                document.getElementById('field-container-link').classList.remove('hidden'); 
            }
            
            document.getElementById('input-content-title').value = '';
            document.getElementById('input-thumb-base64').value = '';
            document.getElementById('input-content-body').value = '';
            document.getElementById('input-reminder-date').value = '';
            document.getElementById('input-reminder-body').value = '';
            document.getElementById('input-content-url').value = '';
            document.getElementById('input-link-desc').value = '';
        }

        function editContent(id) {
            const item = contents.find(c => c.id === id);
            if (!item) return;
            openAddContentModal(item.type);
            document.getElementById('input-edit-id').value = item.id;
            document.getElementById('input-content-title').value = item.title || '';
            document.getElementById('input-thumb-base64').value = item.thumbnail || '';

            if (item.type === 'note') {
                document.getElementById('input-content-body').value = item.body || '';
            } else if (item.type === 'reminder') {
                document.getElementById('input-reminder-date').value = item.dueDate || '';
                document.getElementById('input-reminder-body').value = item.body || '';
            } else if (item.type === 'link') {
                document.getElementById('input-content-url').value = item.url || '';
                document.getElementById('input-link-desc').value = item.description || '';
            }
        }

        function closeModals() {
            document.getElementById('modal-container').classList.add('hidden');
            document.getElementById('modal-teacher-auth').classList.add('hidden');
            document.getElementById('modal-add-grade').classList.add('hidden');
            document.getElementById('modal-edit-grade-profile').classList.add('hidden');
            document.getElementById('modal-add-content').classList.add('hidden');
            document.getElementById('modal-view-detail').classList.add('hidden');
        }

        async function saveNewGrade() {
            const name = document.getElementById('input-grade-name').value.trim();
            const desc = document.getElementById('input-grade-desc').value.trim();
            const teacherName = document.getElementById('input-grade-teacher-name').value.trim();
            const teacherBio = document.getElementById('input-grade-teacher-desc').value.trim();
            const teacherPhoto = document.getElementById('input-grade-teacher-photo-base64').value.trim();

            if (!name) return;
            const newGrade = {
                id: 'grade-' + Date.now(),
                name: name,
                description: desc,
                teacherName: teacherName || 'Instructor',
                teacherBio: teacherBio || desc,
                teacherPhoto: teacherPhoto || 'https://placehold.co/150/4f46e5/ffffff?text=TC'
            };

            grades.push(newGrade);
            safeLocalStorageSet('math_grades_v4', JSON.stringify(grades));

            if (isSupabaseConnected && supabaseClient) {
                await supabaseClient.from('grades').upsert(newGrade, { onConflict: 'id' });
            }

            closeModals();
            selectGrade(newGrade.id);
        }

        async function deleteActiveGrade() {
            if (!confirm("Delete this grade?")) return;
            const id = activeGradeId;
            if (isSupabaseConnected && supabaseClient) {
                await supabaseClient.from('grades').delete().eq('id', id);
            }
            grades = grades.filter(g => g.id !== id);
            safeLocalStorageSet('math_grades_v4', JSON.stringify(grades));
            deselectGrade();
        }

        async function saveNewContent() {
            const title = document.getElementById('input-content-title').value.trim();
            const editId = document.getElementById('input-edit-id').value;
            if (!title) return;

            const existingItem = editId ? contents.find(c => c.id === editId) : null;
            let updatedItem = {
                id: editId || ('c-' + Date.now()),
                grade_id: activeGradeId,
                type: currentContentType,
                title: title,
                thumbnail: document.getElementById('input-thumb-base64').value || (existingItem ? existingItem.thumbnail : ''),
                body: currentContentType === 'note' ? document.getElementById('input-content-body').value : (currentContentType === 'reminder' ? document.getElementById('input-reminder-body').value : ''),
                dueDate: currentContentType === 'reminder' ? document.getElementById('input-reminder-date').value : '',
                url: currentContentType === 'link' ? document.getElementById('input-content-url').value : '',
                description: currentContentType === 'link' ? document.getElementById('input-link-desc').value : ''
            };

            if (editId) contents = contents.map(c => c.id === editId ? updatedItem : c);
            else contents.push(updatedItem);

            safeLocalStorageSet('math_contents_v4_' + activeGradeId, JSON.stringify(contents));

            if (isSupabaseConnected && supabaseClient) {
                await supabaseClient.from('contents').upsert(updatedItem, { onConflict: 'id' });
            }

            closeModals();
            renderContents();
        }

        async function deleteContent(id) {
            if (!confirm("Delete item?")) return;
            if (isSupabaseConnected && supabaseClient) {
                await supabaseClient.from('contents').delete().eq('id', id);
            }
            contents = contents.filter(c => c.id !== id);
            safeLocalStorageSet('math_contents_v4_' + activeGradeId, JSON.stringify(contents));
            renderContents();
        }

        function compressImage(event, targetInputId, maxWidth = 300) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);
                    document.getElementById(targetInputId).value = compressedBase64;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
